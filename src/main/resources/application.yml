spring:
  application:
    name: terranga_connect
  datasource:
    url: jdbc:postgresql://localhost:5432/terranga_connect
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: localhost
      port: 6379
      password:
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 1

server:
  port: 8099

api:
  api-football:
    base-url: https://v3.football.api-sports.io/
    header:
      key: x-apisports-key
      value: ${API_FOOTBALL_KEY:8d9aab264ad0499f3243f6e1050e94a1}
    id:
      senegal-team: 13
    # Laisser vide pour calculer la saison courante automatiquement
    season: ${API_FOOTBALL_SEASON:}
  newsapi:
    key: ${NEWSAPI_KEY:d047dbe5c31b47a995f5cb00949f1e4b}
    # Match dans le titre uniquement (qInTitle) avec variantes Sénégal
    query: "(senegal OR sénégal OR sénégalais OR sénégalaise OR senegalais OR teranga OR téranga)"
    language: fr

firebase:
  # Nom du fichier service-account JSON dans src/main/resources/
  # Le fichier est gitignoré — chaque dev/env doit fournir le sien
  service-account-file: ${FIREBASE_SERVICE_ACCOUNT_FILE:firebase-service-account.json}

logging:
  level:
    com:
      terranga: DEBUG